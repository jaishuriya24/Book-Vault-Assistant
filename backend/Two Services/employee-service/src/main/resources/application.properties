server.port=8082

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.username=system
spring.datasource.password=admin
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# validate = checks the table matches Employee.java, changes nothing (run schema.sql first)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Required if your Oracle is 11g (e.g. Oracle 11g XE) - without this,
# Hibernate generates "FETCH FIRST ... ROWS ONLY" (Oracle 12c+ only syntax)
# and any paginated/limited query fails with ORA-00933. On Oracle 12c or
# newer, delete this line and let Hibernate auto-detect the dialect instead.
# Hibernate 7 consolidated the old per-version Oracle dialects (Oracle9i,
# Oracle10g, etc.) into this one class - it still generates ROWNUM-based
# pagination compatible with 11g.
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect

# --- JWT settings ---
# MUST match auth-service's app.jwt.secret exactly - that shared value is what
# lets this service verify a token it never issued and never calls auth-service to check.
app.jwt.secret=ChangeThisToARandom256BitSecretKeySharedByBothServices
app.jwt.expiration-ms=3600000
