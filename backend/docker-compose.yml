version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_vault
    ports:
      - "5432:5432"
    volumes:
      - book_vault_pgdata:/var/lib/postgresql/data

volumes:
  book_vault_pgdata:
